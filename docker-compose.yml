services:
  database:
    image: postgres:16
    container_name: viridisca-database
    environment:
      - POSTGRES_DB=viridisca
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - viridisca-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: src/API/Viridisca.Api/Dockerfile
    container_name: viridisca-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=database;Port=5432;Database=viridisca;Username=postgres;Password=postgres
    ports:
      - "5280:8080"

volumes:
  viridisca-db-data:
